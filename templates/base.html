<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobHunt AI{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .sidebar { min-height: 100vh; background: #343a40; }
        .sidebar a { color: #adb5bd; text-decoration: none; padding: 10px 15px; display: block; }
        .sidebar a:hover, .sidebar a.active { background: #495057; color: #fff; }
        .card { border: none; shadow: sm; }
        .stat-card { border-left: 4px solid; }
        .stat-card.blue { border-color: #0d6efd; }
        .stat-card.green { border-color: #198754; }
        .stat-card.orange { border-color: #fd7e14; }
        .stat-card.red { border-color: #dc3545; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-0">
                <div class="p-3 text-white">
                    <h4><i class="bi bi-robot"></i> JobHunt AI</h4>
                </div>
                <nav>
                    <a href="{{ url_for('web.index') }}"><i class="bi bi-house"></i> Dashboard</a>
                    <a href="{{ url_for('web.jobs') }}"><i class="bi bi-briefcase"></i> Ofertas</a>
                    <a href="{{ url_for('web.applications') }}"><i class="bi bi-send-check"></i> Aplicaciones</a>
                    <a href="{{ url_for('web.stats') }}"><i class="bi bi-graph-up"></i> Estadísticas</a>
                    <a href="/interview"><i class="bi bi-chat-dots"></i> Entrevista</a>
                    <a href="{{ url_for('web.settings') }}"><i class="bi bi-gear"></i> Configuración</a>
                </nav>
            </div>
            <div class="col-md-10 p-4">
                {% block content %}{% endblock %}
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
